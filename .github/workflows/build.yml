name: Build

on:
  push:
    branches: [ master ]
    # pushing a tag like v0.20 builds and publishes a GitHub release with the zipped application
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [ x64 ]
        configuration: [ Release ]

    env:
      # compiled vcpkg dependencies are cached between runs (first build takes ~15 min)
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up vcpkg
        shell: pwsh
        run: |
          # use the vcpkg checkout preinstalled on the runner, updated so that the
          # builtin-baseline commit from vcpkg.json is available
          $root = $env:VCPKG_INSTALLATION_ROOT
          git -C $root fetch --quiet origin
          git -C $root checkout --quiet origin/master
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "${{ github.workspace }}\vcpkg-cache" | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-${{ matrix.platform }}-

      - name: Restore NuGet packages
        run: msbuild CbxConverterEx.sln -t:restore -p:RestorePackagesConfig=true -nologo -v:minimal

      - name: Build
        run: msbuild CbxConverterEx.sln -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} -m -nologo -v:minimal

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: CbxConverterEx-${{ matrix.platform }}-${{ github.sha }}
          path: |
            bin/${{ matrix.platform }}/${{ matrix.configuration }}/
            !bin/${{ matrix.platform }}/${{ matrix.configuration }}/*.pdb
            !bin/${{ matrix.platform }}/${{ matrix.configuration }}/*.lib
            !bin/${{ matrix.platform }}/${{ matrix.configuration }}/*.exp
            !bin/${{ matrix.platform }}/${{ matrix.configuration }}/*.winmd
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version
        shell: pwsh
        run: |
          # tag must match the version compiled into the application (src/App/resource.h)
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $line = Select-String -Path src/App/resource.h -Pattern '#define CBX_VERSION_STRING\s+"([^"]+)"'
          $version = $line.Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            Write-Error "Tag ${{ github.ref_name }} does not match CBX_VERSION_STRING $version in src/App/resource.h"
            exit 1
          }

      - name: Download application
        uses: actions/download-artifact@v4
        with:
          name: CbxConverterEx-x64-${{ github.sha }}
          path: CbxConverterEx

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path CbxConverterEx -DestinationPath "CbxConverterEx-${{ github.ref_name }}-x64.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "CbxConverterEx-${{ github.ref_name }}-x64.zip" --title "CbxConverterEx ${{ github.ref_name }}" --generate-notes
